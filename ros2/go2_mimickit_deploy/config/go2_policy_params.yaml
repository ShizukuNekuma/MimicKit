go2_policy_node:
  ros__parameters:
    policy_path: "output/go2_deploy/deepmimic_go2_pace/policy.onnx"
    reference_path: "output/go2_deploy/deepmimic_go2_pace/pace_reference.csv"
    dry_run: true
    publish_damping_when_disarmed: true
    imu_quat_wxyz: true
    low_level_hz: 500.0
    policy_hz: 30.0
    kp: 40.0
    kd: 3.0
    damping_kd: 2.0
    phase_speed_default: 1.0
    phase_speed_min: 0.5
    phase_speed_max: 1.3
    phase_speed_step: 0.05
    arm_button_mask: 1
    disarm_button_mask: 2
    estop_button_mask: 4
    enable_hold_button_mask: 0
    speed_up_button_mask: 0
    speed_down_button_mask: 0
    blend_seconds: 1.0
    log_every_n_policy_ticks: 30
